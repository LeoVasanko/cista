[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cista"
dynamic = ["version"]
description = "Dropbox-like file server with modern web interface"
readme = "README.md"
license = ""
authors = [
    { name = "Vasanko" },
]
classifiers = [
]
dependencies = [
    "argon2-cffi",
    "docopt",
    "inotify",
    "msgspec",
    "pathvalidate",
    "pyjwt",
    "sanic",
    "tomli_w",
]

[project.urls]
Homepage = ""

[project.scripts]
cista = "cista.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatchling]
# Build frontend
pre_build = "npm run build --prefix cista-front"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
hooks.vcs.version-file = "cista/_version.py"
hooks.vcs.template = """
# This file is automatically generated by hatch build.
__version__ = {version!r}
"""

targets.sdist.include = [
    "/cista",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--verbosity=-1",
    "-p no:warnings",
]
testpaths = [
    "tests",
]

[tool.isort]
#src_paths = ["cista", "tests"]
line_length = 120
multi_line_output = 5
