[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cista"
dynamic = ["version"]
description = "Dropbox-like file server with modern web interface"
readme = "README.md"
license = ""
authors = [
    { name = "Vasanko lda" },
]
classifiers = [
]
dependencies = [
    "argon2-cffi",
    "msgspec",
    "pathvalidate",
    "sanic",
    "tomli_w",
    "watchdog",
]

[project.urls]
Homepage = ""

[tool.hatch]
version.source = "vcs"

[tool.hatch.build]
hooks.vcs.version-file = "cista/_version.py"
hooks.vcs.template = """
# This file is automatically generated by hatch build.
version = {version!r}
version_tuple = {version_tuple!r}
"""
targets.sdist.include = [
    "/cista",
]
