[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cista"
dynamic = ["version"]
description = "Dropbox-like file server with modern web interface"
readme = "README.md"
authors = [
    { name = "Vasanko" },
]
classifiers = [
]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "av",
    "blake3",
    "brotli",
    "docopt",
    "inotify",
    "msgspec",
    "natsort",
    "numpy>=2.3.2",
    "pathvalidate",
    "pillow",
    "pillow-heif>=1.1.0",
    "pyjwt",
    "pymupdf",
    "sanic",
    "setproctitle",
    "stream-zip",
    "tomli_w",
]

[project.urls]
Homepage = "https://git.zi.fi/Vasanko/cista-storage"

[project.scripts]
cista = "cista.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
artifacts = ["cista/wwwroot"]
targets.sdist.hooks.custom.path = "scripts/build-frontend.py"
targets.sdist.include = [
    "/cista",
]
hooks.vcs.version-file = "cista/_version.py"
hooks.vcs.template = """
# This file is automatically generated by hatch build.
__version__ = {version!r}
"""
only-packages = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--verbosity=-1",
    "-p no:warnings",
]
testpaths = [
    "tests",
]

[tool.ruff.lint]
isort.known-first-party = ["cista"]
per-file-ignores."tests/*" = ["S", "ANN", "D", "INP"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
